onboarding = false

[theme]
name = "catppuccin"

# keep tmux muscle memory: prefix is ctrl+a, splits are | and -,
# prefix+m maximizes, focus stays on h/j/k/l
[keys]
prefix = "ctrl+a"
split_vertical = "prefix+|"
split_horizontal = "prefix+-"
zoom = "prefix+m"

[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "sessionizer.pick"
description = "fuzzy-switch workspace"

[[keys.command]]
key = "ctrl+f"
type = "plugin_action"
command = "sessionizer.pick"
description = "fuzzy-switch workspace (same session)"

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "sessionizer.agents"
description = "jump to an agent"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"
